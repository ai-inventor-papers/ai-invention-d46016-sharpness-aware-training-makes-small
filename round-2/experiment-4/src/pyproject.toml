[project]
name = "sam-vs-sgd-matched-loss"
version = "1.0.0"
description = "SAM vs SGD at matched training loss on Fashion-MNIST (calibration and accuracy)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "setuptools==84.2.1",
    "attrs==26.1.0",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "filelock==4.3.1",
    "fonttools==4.68.0",
    "fsspec==2026.9.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "kiwisolver==1.5.1",
    "loguru==0.8.0",
    "markupsafe==3.0.4",
    "matplotlib==3.11.2",
    "mpmath==1.3.0",
    "networkx==3.7",
    "numpy==2.5.5",
    "packaging==26.4",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "pyparsing==3.3.3",
    "python-dateutil==4.0.0",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "scipy==1.18.1",
    "sympy==1.14.0",
    "torch==2.16.0.dev20261116+aii1",
    "torchvision==0.30.0.dev20261116",
    "typing-extensions==4.16.0",
    "tzdata==2026.6",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["method", "analysis"]
