[project]
name = "sam-sgd-calibration"
version = "1.0.0"
description = "SAM vs SGD calibration on a small CNN (Fashion-MNIST)"
requires-python = "==3.12.*"
dependencies = [
    "attrs==26.1.0",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "filelock==4.3.1",
    "fonttools==4.68.0",
    "fsspec==2026.9.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "kiwisolver==1.5.1",
    "loguru==0.8.0",
    "markupsafe==3.0.4",
    "matplotlib==3.11.2",
    "mpmath==1.3.0",
    "networkx==3.7",
    "numpy==2.5.5",
    "packaging==26.4",
    "pillow==13.0.0",
    "psutil==7.2.2",
    "pyparsing==3.3.3",
    "python-dateutil==4.0.0",
    "referencing==0.37.0",
    "rpds-py==2026.9.1",
    "scipy==1.18.1",
    "sympy==1.14.0",
    "torch==2.16.0.dev20261116+aii1",
    "torchvision==0.30.0.dev20261116",
    "typing-extensions==4.16.0",
    "tzdata==2026.6",
]

[tool.uv]
package = false
# The pinned torch build comes from the run's package mirror and needs a Linux-only
# triton; resolve for the macOS environment the results were produced on.
environments = ["sys_platform == 'darwin'"]
